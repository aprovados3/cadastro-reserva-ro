<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Aprovados - Polícia Civil RO</title>
  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      overflow-x: hidden;
    }

    body {
      font-family: Arial, sans-serif;
      background-image: url('civil.jfif');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      backdrop-filter: brightness(0.85);
      min-height: 100vh;
    }

    .container {
      max-width: 600px;
      margin: 40px auto;
      background: rgba(0, 0, 0, 0.65); 
      border-radius: 10px;
      padding: 25px 30px;
      box-shadow: 0 0 15px rgba(0,0,0,0.5); 
    }

    h1 {
      color: #fff; 
      margin-bottom: 15px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .logo-titulo {
      width: 130px;
      height: auto;
    }

    #infoContadores {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 15px;
      font-style: italic;
      color: #eee;
      margin-bottom: 20px;
      font-weight: 600;
      font-size: 16px;
      white-space: nowrap;
    }

    label {
      font-weight: bold;
      color: #eee; 
    }

    input[type="text"] {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
      margin-bottom: 10px;
      border-radius: 5px;
      border: 1px solid #ccc;
      font-size: 16px;
      box-sizing: border-box;
    }

    #mensagem {
      color: #ff6b6b; 
      font-weight: bold;
      margin-bottom: 10px;
      text-align: center;
      min-height: 24px;
    }

    .buscar-container {
      display: flex;
      justify-content: center;
      margin-bottom: 15px;
    }

    .botoes-container {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 10px;
    }

    .buscar-container button,
    .botoes-container button {
      padding: 10px 20px;
      font-size: 16px;
      cursor: pointer;
      border-radius: 5px;
      border: none;
      background-color: #007BFF;
      color: white;
      transition: background-color 0.3s;
      width: 180px;
      text-align: center;
    }

    .buscar-container button:hover,
    .botoes-container button:hover {
      background-color: #0056b3;
    }

    .social-row {
      display: flex;
      justify-content: flex-end; 
      margin-top: 15px;         
      width: 100%;
      padding-right: 5px;       
      box-sizing: border-box;
    }

    .btn-instagram {
      display: flex; 
      align-items: center;
      justify-content: center;
      gap: 8px; 
      padding: 0; 
      background: none;
      border: none; 
      box-shadow: none; 
      text-decoration: none; 
      color: #eee; 
      font-weight: bold;
      font-size: 16px;
      transition: transform 0.2s ease-in-out, color 0.3s; 
      animation: instagramPulsando 1.5s infinite alternate;
    }

    .btn-instagram:hover {
      opacity: 1;
      transform: scale(1.05); 
      color: #e1306c; 
    }

    .btn-instagram img {
      width: 40px; 
      height: auto;
      vertical-align: middle; 
    }

    #btnNoticias {
      animation: sombraPiscando 1.2s infinite alternate;
      position: relative; 
      z-index: 1;
    }

    @keyframes sombraPiscando {
      0% { box-shadow: 0 0 0px red; }
      100% { box-shadow: 0 0 15px 5px red; }
    }

    @keyframes instagramPulsando {
      0% {
        transform: scale(1);
      }
      100% {
        transform: scale(1.08); 
      }
    }

    .resultado-box {
      border: 2px solid #555;
      padding: 15px;
      margin-top: 15px;
      border-radius: 8px;
      background-color: #f9f9f9; 
      color: #333; 
    }

    .resultado-box:hover {
      background-color: #e0e0e0;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>
      <img src="movimento9.png" alt="Logo" class="logo-titulo">
      CR - Polícia Civil RO
    </h1>

    <div id="infoContadores" class="info-box">
      <span>🕵️‍♂️ <strong>Total Escrivães:</strong> <span id="totalEscrivao">0</span></span>
    </div>

    <label for="inputNome">Digite seu nome:</label>
    <input type="text" id="inputNome" placeholder="Ex: João Silva" autocomplete="off" />

    <div id="mensagem"></div>

    <div class="buscar-container">
      <button id="btnBuscar">🔎 Buscar</button>
    </div>

    <div class="botoes-container">
      <button id="btnListarEscrivao">🕵️‍♂️ Listar Escrivães</button>
      <button id="btnNoticias" onclick="window.location.href='movimento.html'">📣 Notícias </button>
    </div>

    <div class="social-row">
      <a href="https://www.instagram.com/aprovadospcro2022/" target="_blank" class="btn-instagram">
        <img src="logo-instagram-4096.png" alt="Instagram">
        <span>Instagram</span>
      </a>
    </div>

    <div id="resultado"></div>
  </div>

  <script>
    const btnBuscar = document.getElementById('btnBuscar');
    const btnListarEscrivao = document.getElementById('btnListarEscrivao');
    const inputNome = document.getElementById('inputNome');
    const resultado = document.getElementById('resultado');
    const mensagem = document.getElementById('mensagem');

    const totalEscrivaoSpan = document.getElementById('totalEscrivao');

    let escrivaos = [];

    function removerAcentos(str) {
      return str.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();
    }

    async function carregarCSV(url, cargo) {
      const resposta = await fetch(url);
      const texto = await resposta.text();
      const linhas = texto.trim().split('\n').filter(linha => linha.trim() !== '');
      return linhas.map(linha => {
        const partes = linha.split(',');
        const nome = partes[0].replace(/^"|"$/g, '').trim();
        const posicao = partes[1].replace(/^"|"$/g, '').trim();
        return { nome, nomeNormalizado: removerAcentos(nome), posicao, cargo };
      });
    }

    async function carregarDados() {
      escrivaos = await carregarCSV('escrivao.csv', 'Escrivão');
      totalEscrivaoSpan.textContent = escrivaos.length;
    }

    function mostrarMensagemStatus(texto) {
      mensagem.textContent = texto;
    }

    function mostrarResultados(lista) {
      resultado.innerHTML = "";
      if (lista.length === 0) {
        mostrarMensagemStatus("❌ Nenhum resultado encontrado.");
        return;
      }
      mostrarMensagemStatus("");

      lista.forEach(item => {
        const div = document.createElement('div');
        div.className = 'resultado-box';

        let html = `<strong>Nome:</strong> ${item.nome}<br>`;

        if (item.posicaoEscrivao && item.posicaoEscrivao.toLowerCase() !== 'null') {
          html += `<strong>🕵️‍♂️ Posição como Escrivão:</strong>  ${item.posicaoEscrivao}<br>`;
        }

        div.innerHTML = html;
        resultado.appendChild(div);
      });
    }

    function buscarNome(nomeBusca) {
      resultado.innerHTML = "";
      mostrarMensagemStatus("");

      if (!nomeBusca) {
        mostrarMensagemStatus("⚠️ Por favor, digite um nome para buscar.");
        return;
      }

      const nomeBuscaNormalizado = removerAcentos(nomeBusca);
      const termosBusca = nomeBuscaNormalizado.split(" ").filter(t => t.trim() !== "");

      const contemTodosTermos = (candidato) => {
        return termosBusca.every(termo => candidato.nomeNormalizado.includes(termo));
      };

      const encontradosEscrivao = escrivaos.filter(contemTodosTermos);

      const listaResultado = encontradosEscrivao.map(e => ({
        nome: e.nome,
        posicaoEscrivao: e.posicao
      }));

      mostrarResultados(listaResultado);
    }

    function listarEscrivao() {
      resultado.innerHTML = "";
      mostrarMensagemStatus("");

      if (escrivaos.length === 0) {
        mostrarMensagemStatus("❌ Nenhum escrivão encontrado.");
        return;
      }
      const lista = escrivaos.map(e => ({
        nome: e.nome,
        posicaoEscrivao: e.posicao
      }));
      mostrarResultados(lista);
    }

    btnBuscar.addEventListener('click', () => {
      const nomeBusca = inputNome.value.trim();
      buscarNome(nomeBusca);
    });

    inputNome.addEventListener('keydown', e => {
      if (e.key === 'Enter') {
        e.preventDefault();
        btnBuscar.click();
      }
    });

    btnListarEscrivao.addEventListener('click', listarEscrivao);

    carregarDados().catch(e => {
      mostrarMensagemStatus('Erro ao carregar dados. Atualize a página.');
      console.error('Erro ao carregar CSV:', e);
    });
  </script>
</body>
</html>
